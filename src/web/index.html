<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EliteAchievements</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Boot / terminal screen -->
  <div id="boot">
    <div class="boot-inner">
      <div id="boot-log" class="boot-log"></div>
      <div class="boot-hint">press any key to skip</div>
    </div>
    <div class="scanlines" aria-hidden="true"></div>
  </div>

  <!-- Main app -->
  <div id="app" hidden>
    <div id="ribbon" class="ribbon"></div>
    <header id="header" class="header"></header>
    <main id="screen" class="screen"></main>
    <footer id="statusbar" class="statusbar"></footer>
    <div class="scanlines" aria-hidden="true"></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
